name: vLLM_Inference

networks:
  server:
    driver: bridge

services:
  vllm:
    image: vllm/vllm-openai:v0.27.0
    container_name: vLLM_Baseline
    privileged: true
    env_file:
      - ../../.env
    networks:
      - server
    ports:
      - "8000:8000" 
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HOME=/data/hf
      - HF_HUB_CACHE=/data/hf/hub
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HOME}/.cache/huggingface:/data/hf
      - /dev/null:/etc/ld.so.conf.d/00-cuda-compat.conf
    command:
      - --model=Qwen/Qwen3-8B
      - --dtype=auto
      - --gpu-memory-utilization=0.9
      - --max-model-len=8192